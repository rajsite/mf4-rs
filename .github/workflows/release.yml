name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  compute-bump:
    name: Compute SemVer bump from Conventional Commits
    runs-on: ubuntu-latest
    outputs:
      release_needed: ${{ steps.bump.outputs.release_needed }}
      new_version: ${{ steps.bump.outputs.new_version }}
      previous_tag: ${{ steps.bump.outputs.previous_tag }}
      bump: ${{ steps.bump.outputs.bump }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: bump
        name: Determine next version
        shell: python
        run: |
          import os, pathlib, re, subprocess

          def parse(v):
              return tuple(int(x) for x in v.lstrip("v").split("."))

          tags = subprocess.check_output(
              ["git", "tag", "--list", "v*", "--sort=-v:refname"], text=True
          ).split()
          last_tag = tags[0] if tags else "v0.0.0"
          range_arg = "HEAD" if last_tag == "v0.0.0" else f"{last_tag}..HEAD"

          # The bump base is the maximum of the latest v* tag and the
          # version currently declared in Cargo.toml. This way, a manually
          # bumped Cargo.toml version (or a version published to a registry
          # before the workflow was wired up) is honored, and we never
          # downgrade.
          cargo_version = re.search(
              r'^version\s*=\s*"([^"]+)"',
              pathlib.Path("Cargo.toml").read_text(),
              re.M,
          ).group(1)
          base_v = max(parse(last_tag), parse(cargo_version))
          base_label = f"v{'.'.join(str(x) for x in base_v)}"

          hashes = subprocess.check_output(
              ["git", "log", range_arg, "--format=%H"], text=True
          ).split()

          TYPE_RE = re.compile(
              r"^(feat|fix|perf|refactor|chore|docs|test|ci|build|style)"
              r"(\([^)]+\))?(!)?:"
          )
          BREAKING_FOOTER = re.compile(r"^BREAKING[ -]CHANGE:", re.M | re.I)

          rank = {"none": 0, "patch": 1, "minor": 2, "major": 3}
          bump = "none"

          for h in hashes:
              body = subprocess.check_output(
                  ["git", "show", "-s", "--format=%B", h], text=True
              )
              subject = body.splitlines()[0] if body else ""
              m = TYPE_RE.match(subject)
              if (m and m.group(3) == "!") or BREAKING_FOOTER.search(body):
                  bump = "major"
                  break
              if not m:
                  continue
              t = m.group(1)
              if t == "feat" and rank[bump] < rank["minor"]:
                  bump = "minor"
              elif t in ("fix", "perf") and rank[bump] < rank["patch"]:
                  bump = "patch"

          major, minor, patch = base_v
          if bump == "major":
              major, minor, patch = major + 1, 0, 0
          elif bump == "minor":
              minor, patch = minor + 1, 0
          elif bump == "patch":
              patch += 1

          new_version = f"{major}.{minor}.{patch}" if bump != "none" else ""
          release_needed = "true" if bump != "none" else "false"

          print(f"Latest tag: {last_tag}")
          print(f"Cargo.toml version: {cargo_version}")
          print(f"Bump base: {base_label}")
          print(f"Commits analyzed: {len(hashes)}")
          print(f"Bump: {bump}")
          print(f"New version: {new_version or '(none — skipping release)'}")

          # previous_tag stays as the actual latest git tag so the
          # changelog step can use it as a `git log <prev>..HEAD` range.
          # bump_base is the synthetic baseline used for SemVer arithmetic.
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"previous_tag={last_tag}\n")
              f.write(f"bump_base={base_label}\n")
              f.write(f"new_version={new_version}\n")
              f.write(f"release_needed={release_needed}\n")
              f.write(f"bump={bump}\n")

  bump-and-tag:
    name: Bump version, update changelog, tag
    needs: compute-bump
    if: needs.compute-bump.outputs.release_needed == 'true'
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ needs.compute-bump.outputs.new_version }}
      tag: v${{ needs.compute-bump.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure git author
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump Cargo.toml
        run: |
          sed -i -E 's/^version *= *"[^"]+"/version = "${{ needs.compute-bump.outputs.new_version }}"/' Cargo.toml
          grep '^version' Cargo.toml

      - name: Bump pyproject.toml
        run: |
          python -c "
          import re, pathlib
          p = pathlib.Path('pyproject.toml')
          new = re.sub(r'^version = \".*\"', 'version = \"${{ needs.compute-bump.outputs.new_version }}\"', p.read_text(), count=1, flags=re.M)
          p.write_text(new)
          "
          grep '^version' pyproject.toml

      - name: Bump js/package.json
        working-directory: js
        run: |
          npm version "${{ needs.compute-bump.outputs.new_version }}" --no-git-tag-version
          grep '"version"' package.json | head -1

      - uses: dtolnay/rust-toolchain@stable

      - name: Refresh Cargo.lock
        run: cargo update -p mf4-rs

      - name: Generate changelog entry
        id: changelog
        env:
          PREVIOUS_TAG: ${{ needs.compute-bump.outputs.previous_tag }}
          NEW_VERSION: ${{ needs.compute-bump.outputs.new_version }}
        shell: python
        run: |
          import datetime, os, pathlib, re, subprocess

          prev = os.environ["PREVIOUS_TAG"]
          new_tag = "v" + os.environ["NEW_VERSION"]
          range_arg = "HEAD" if prev == "v0.0.0" else f"{prev}..HEAD"

          subjects = subprocess.check_output(
              ["git", "log", range_arg, "--format=%s"], text=True
          ).splitlines()

          TYPE = re.compile(r"^([a-z]+)(\([^)]+\))?(!)?:\s*(.+)$")
          groups = [
              ("feat",     "Features"),
              ("fix",      "Fixes"),
              ("perf",     "Performance"),
              ("refactor", "Refactors"),
              ("docs",     "Docs"),
              ("build",    "Build"),
              ("ci",       "CI"),
          ]
          breaking = []
          buckets = {t: [] for t, _ in groups}
          for s in subjects:
              m = TYPE.match(s)
              if not m:
                  continue
              t, _, bang, desc = m.groups()
              if bang:
                  breaking.append(f"- {desc}")
              if t in buckets:
                  buckets[t].append(f"- {desc}")

          today = datetime.date.today().isoformat()
          lines = [f"## {new_tag} — {today}", ""]
          if breaking:
              lines += ["### BREAKING CHANGES", *breaking, ""]
          for t, label in groups:
              if buckets[t]:
                  lines += [f"### {label}", *buckets[t], ""]

          new_section = "\n".join(lines).rstrip() + "\n"
          pathlib.Path("new_section.md").write_text(new_section)

          changelog = pathlib.Path("CHANGELOG.md")
          if changelog.exists():
              changelog.write_text(new_section + "\n" + changelog.read_text())
          else:
              header = (
                  "# Changelog\n\n"
                  "All notable changes to mf4-rs are documented in this file. "
                  "This project follows Semantic Versioning and Conventional Commits.\n\n"
              )
              changelog.write_text(header + new_section)

          print("--- generated changelog section ---")
          print(new_section)

      - name: Commit, tag, and push
        run: |
          set -euo pipefail
          new='v${{ needs.compute-bump.outputs.new_version }}'
          git add Cargo.toml Cargo.lock pyproject.toml js/package.json js/package-lock.json CHANGELOG.md
          git commit -m "chore(release): ${new}"
          git tag -a "${new}" -m "Release ${new}"
          git push origin HEAD:main
          git push origin "${new}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.compute-bump.outputs.new_version }}" \
            --title "v${{ needs.compute-bump.outputs.new_version }}" \
            --notes-file new_section.md

  build-wheels-linux:
    name: Build wheels (Linux ${{ matrix.target }})
    needs: bump-and-tag
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 needs the AlmaLinux 8-based manylinux_2_28 image:
          # its newer binutils handles the AVX-512 assembly in
          # openssl-src 300.6 (OpenSSL 3.6.2), which fails to assemble
          # on the CentOS 7-based manylinux2014_x86_64 image. Wheels
          # will require glibc 2.28+, which covers RHEL 8+, Ubuntu
          # 18.10+, Debian 10+ — RHEL 7 is already EOL.
          - target: x86_64
            manylinux: "2_28"
          # aarch64 keeps `auto`, which selects the Debian-based
          # rust-cross/manylinux2014-cross image. Its host toolchain
          # is modern enough to assemble OpenSSL 3.6, and cross-build
          # is much faster than QEMU-emulated native builds.
          - target: aarch64
            manylinux: "auto"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-and-tag.outputs.tag }}
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: ${{ matrix.manylinux }}
          sccache: "true"
          # openssl-src (vendored OpenSSL) drives the build via perl's
          # Configure script, which needs FindBin and IPC::Cmd. The
          # native x86_64 manylinux2014 image is CentOS 7 (yum), while
          # the aarch64 cross image is Debian-based (apt-get); detect
          # the package manager and install the right modules.
          # On CentOS 7 (post-EOL vault mirrors) perl-FindBin is no
          # longer a separately-installable subpackage but ships with
          # the main perl package; perl-core also bundles many core
          # modules. perl-IPC-Cmd is still standalone.
          before-script-linux: |
            set -e
            if command -v yum >/dev/null 2>&1; then
              yum install -y perl-core perl-IPC-Cmd
            elif command -v apt-get >/dev/null 2>&1; then
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends perl
            fi
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  build-wheels-macos:
    name: Build wheels (macOS ${{ matrix.target }})
    needs: bump-and-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-and-tag.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  build-wheels-windows:
    name: Build wheels (Windows ${{ matrix.target }})
    needs: bump-and-tag
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-and-tag.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  build-sdist:
    name: Build source distribution
    needs: bump-and-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-and-tag.outputs.tag }}
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  publish-pypi:
    name: Publish to PyPI
    needs:
      - build-wheels-linux
      - build-wheels-macos
      - build-wheels-windows
      - build-sdist
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mf4-rs
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List collected artifacts
        run: ls -la dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  publish-crates:
    name: Publish to crates.io
    needs: bump-and-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-and-tag.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Dry-run publish
        run: cargo publish --dry-run --allow-dirty
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --token "$CARGO_REGISTRY_TOKEN"

  publish-npm:
    name: Publish to npm
    needs: bump-and-tag
    runs-on: ubuntu-latest
    # Authentication uses npm Trusted Publishing (OIDC) — no npm token
    # is stored. Requires a Trusted Publisher entry on the npm package
    # (Settings -> Trusted Publisher: GitHub Actions, dmagyar-0/mf4-rs,
    # workflow release.yml) and the id-token permission below. npm
    # attaches provenance automatically when publishing via OIDC.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-and-tag.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # wasm-opt is disabled in Cargo.toml ([package.metadata.wasm-pack]),
      # so wasm-pack needs no binaryen download at build time.
      - name: Install wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      # Deliberately no `registry-url` here: setting it makes setup-node
      # write an .npmrc with `_authToken=${NODE_AUTH_TOKEN}` (and export a
      # placeholder value for that variable), and a configured auth token
      # takes precedence over OIDC — npm then publishes with the bogus
      # token and fails with E404 instead of using trusted publishing.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Trusted publishing needs npm >= 11.5.1; Node 22 bundles npm 10.
      - name: Update npm for trusted publishing
        run: npm install -g npm@latest && npm --version
      - name: Install npm dependencies
        working-directory: js
        run: npm ci
      # `npm publish` runs the package's prepublishOnly script, which
      # builds both wasm bindings (wasm-pack: nodejs + web targets),
      # compiles the TypeScript wrapper for Node and the browser, and runs
      # the full js test suite before anything is uploaded — a test failure
      # aborts the publish.
      - name: Publish
        working-directory: js
        run: npm publish --access public

  build-wasi-component:
    name: Build WASI Preview 2 component
    # Non-publishing: the wasm32-wasip2 component is not shipped to a
    # registry yet. This job builds it against the tagged release, verifies
    # the exported WIT, composes it with the example commands, and runs each
    # under wasmtime so a broken component fails the release run.
    needs: bump-and-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-and-tag.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: bytecodealliance/actions/wasm-tools/setup@v1
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main
      - name: Install wac
        run: cargo binstall -y wac-cli || cargo install wac-cli
      - name: Build library component
        run: cargo build --release --target wasm32-wasip2 --features wasip2
      - name: Verify exported WIT
        run: wasm-tools component wit target/wasm32-wasip2/release/mf4_rs.wasm
      - name: Compose and run every example
        run: ./wasi/build.sh
      - name: Upload component artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasi-component
          path: target/wasm32-wasip2/release/mf4_rs.wasm
